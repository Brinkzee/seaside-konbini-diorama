<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Seaside Konbini Diorama</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a2542;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a2542;
        touch-action: none;
        content-visibility: auto;
        contain-intrinsic-size: auto 100dvw auto 100dvh;
      }

      #diorama-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="diorama-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
